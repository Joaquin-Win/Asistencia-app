<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title layout:title-pattern="$CONTENT_TITLE — Sistema de Asistencia">Sistema de Asistencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="20" fill="white" fill-opacity="0.2" />
                        <path d="M10 28 Q20 12 30 28" stroke="white" stroke-width="2.5" fill="none"
                            stroke-linecap="round" />
                        <circle cx="20" cy="14" r="4" fill="white" />
                        <path d="M13 28 h14" stroke="white" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="sidebar-brand">
                    <span class="sidebar-title">Asistencia</span>
                    <span class="sidebar-sub">Extensión Universitaria</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Admin menu -->
                <div sec:authorize="hasRole('ADMIN')" class="nav-section">
                    <span class="nav-section-label">Administración</span>
                    <a th:href="@{/admin/dashboard}" class="nav-link">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z" />
                        </svg>
                        <span>Dashboard</span>
                    </a>
                    <a th:href="@{/admin/meetings/new}" class="nav-link">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                                clip-rule="evenodd" />
                        </svg>
                        <span>Nuevo Encuentro</span>
                    </a>
                    <a th:href="@{/admin/users}" class="nav-link">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z" />
                        </svg>
                        <span>Gestión de Usuarios</span>
                    </a>
                </div>

                <!-- Student / extensionist menu -->
                <div class="nav-section">
                    <span class="nav-section-label">Encuentros</span>
                    <a th:href="@{/meetings}" class="nav-link">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z"
                                clip-rule="evenodd" />
                        </svg>
                        <span>Mis Encuentros</span>
                    </a>
                </div>
            </nav>

            <!-- User info at bottom -->
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar" th:text="${#strings.substring(currentUser.displayName, 0, 1)}">A</div>
                    <div class="user-info">
                        <span class="user-name" th:text="${currentUser.displayName}">Usuario</span>
                        <span class="user-role" th:text="${currentUser.roleLabel}">Rol</span>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout" title="Cerrar sesión">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h12a1 1 0 001-1V4a1 1 0 00-1-1H3zm10 7H6.414l1.293 1.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 1.414L6.414 9H13a1 1 0 110 2z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main content -->
        <div class="main-wrapper">
            <!-- Top bar -->
            <header class="topbar">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <div class="topbar-title">
                    <h2 layout:fragment="page-title">Dashboard</h2>
                </div>
                <div class="topbar-actions">
                    <div class="role-badge" th:text="${currentUser.roleLabel}">Rol</div>
                </div>
            </header>

            <!-- Flash messages -->
            <div class="flash-zone">
                <div th:if="${successMessage}" class="alert alert-success">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                            clip-rule="evenodd" />
                    </svg>
                    <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-error">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                            clip-rule="evenodd" />
                    </svg>
                    <span th:text="${errorMessage}"></span>
                </div>
            </div>

            <!-- Page content -->
            <main class="page-content" layout:fragment="content">
                Content goes here
            </main>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
    </script>
    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
