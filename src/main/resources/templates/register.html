<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registro — Sistema de Asistencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body class="login-body">

<div class="login-bg">
    <div class="login-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
</div>

<div class="login-wrapper">
    <div class="login-card">
        <!-- Logo / Brand -->
        <div class="login-brand">
            <div class="login-logo">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="20" fill="#3dbba7"/>
                    <path d="M10 28 Q20 12 30 28" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <circle cx="20" cy="14" r="4" fill="white"/>
                    <path d="M13 28 h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="login-title">Crear Cuenta</h1>
            <p class="login-subtitle">Sistema de Asistencia</p>
        </div>

        <!-- Alerts -->
        <div th:if="${error}" class="alert alert-error">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
            <span th:text="${error}">Error de registro</span>
        </div>

        <!-- Register Form -->
        <form th:action="@{/register}" method="post" class="login-form">
            <div class="form-group">
                <label for="displayName" class="form-label">Nombre y Apellido</label>
                <input type="text" id="displayName" name="displayName" class="form-input" placeholder="Ej: Juan Pérez" required autofocus/>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Correo Institucional</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Ej: jperez@asistencia.edu.ar" required/>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Nombre de usuario" required/>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Tu contraseña" required/>
            </div>

            <button type="submit" class="btn-login">
                Registrarse
            </button>
        </form>

        <div class="login-hint" style="text-align: center; margin-top: 1.5rem;">
            <p class="hint-title">¿Ya tenés cuenta?</p>
            <a th:href="@{/login}" style="color: #3dbba7; text-decoration: none; font-weight: 500;">Volver al Login</a>
        </div>
    </div>
</div>

</body>
</html>
