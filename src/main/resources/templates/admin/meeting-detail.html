<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">

<head>
    <title>Detalle del Encuentro</title>
</head>

<body>

    <div layout:fragment="page-title">Detalle del Encuentro</div>

    <main layout:fragment="content">
        <div class="page-nav">
            <a th:href="@{/admin/dashboard}" class="back-link">
                <svg viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                        clip-rule="evenodd" />
                </svg>
                Volver al Dashboard
            </a>
        </div>

        <div class="detail-layout">
            <div class="detail-main">
                <div class="detail-header">
                    <div class="detail-title-row">
                        <h2 class="detail-title" th:text="${meeting.title}">Título</h2>
                        <div class="meeting-status-badge large" th:text="${meeting.status}"></div>
                    </div>
                    <div class="detail-meta-row">
                        <span class="meta-item">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z"
                                    clip-rule="evenodd" />
                            </svg>
                            <span
                                th:text="${#temporals.format(meeting.date, 'dd MMMM yyyy', new java.util.Locale('es'))}"></span>
                        </span>
                        <span class="meta-item">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"
                                    clip-rule="evenodd" />
                            </svg>
                            <span
                                th:text="${#temporals.format(meeting.startTime, 'HH:mm')} + ' — ' + ${#temporals.format(meeting.endTime, 'HH:mm')}"></span>
                        </span>
                        <span class="meta-item">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"
                                    clip-rule="evenodd" />
                            </svg>
                            <span th:text="${meeting.location}"></span>
                        </span>
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-heading">Descripción</h3>
                    <p th:text="${meeting.description}" class="card-text"></p>
                </div>

                <div class="card">
                    <h3 class="card-heading">Materiales del Encuentro</h3>
                    <div th:if="${#lists.isEmpty(meeting.materials)}" class="empty-state-small">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"
                                clip-rule="evenodd" />
                        </svg>
                        <span>No hay materiales cargados</span>
                    </div>
                    <ul class="materials-list">
                        <li th:each="mat : ${meeting.materials}" class="material-item">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"
                                    clip-rule="evenodd" />
                            </svg>
                            <span th:text="${mat}"></span>
                        </li>
                    </ul>
                </div>

                <div class="card">
                    <h3 class="card-heading">
                        Tareas / Actividades Subidas
                        <span class="count-badge" th:text="${tasks.size()}"></span>
                    </h3>
                    <div th:if="${#lists.isEmpty(tasks)}" class="empty-state-small"><span>No hay tareas cargadas
                            aún</span></div>
                    <div class="task-list">
                        <div th:each="task : ${tasks}" class="task-item">
                            <div class="task-item-header">
                                <span class="task-title" th:text="${task.title}"></span>
                                <span class="task-uploader" th:text="${task.uploaderDisplayName}"></span>
                            </div>
                            <p class="task-desc" th:text="${task.description}"></p>
                            <span class="task-date"
                                th:text="'Subido el ' + ${#temporals.format(task.uploadedAt, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="detail-sidebar">
                <div class="card">
                    <h3 class="card-heading">Control</h3>
                    <div class="control-actions">
                        <form th:action="@{/admin/meeting/{id}/toggle-lock(id=${meeting.id})}" method="post">
                            <button type="submit" class="btn btn-full"
                                th:classappend="${meeting.locked} ? 'btn-success' : 'btn-danger'">
                                <svg th:if="${meeting.locked}" viewBox="0 0 20 20" fill="currentColor">
                                    <path
                                        d="M10 2a5 5 0 00-5 5v2a2 2 0 00-2 2v5a2 2 0 002 2h10a2 2 0 002-2v-5a2 2 0 00-2-2H7V7a3 3 0 015.905-.75 1 1 0 001.937-.5A5.002 5.002 0 0010 2z" />
                                </svg>
                                <svg th:unless="${meeting.locked}" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                        clip-rule="evenodd" />
                                </svg>
                                <span
                                    th:text="${meeting.locked} ? 'Desbloquear Asistencia' : 'Bloquear Asistencia'"></span>
                            </button>
                        </form>
                        <a th:href="@{/admin/meetings/edit/{id}(id=${meeting.id})}"
                            class="btn btn-outline btn-full">Editar Encuentro</a>
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-heading">
                        Lista de Asistentes
                        <span class="count-badge" th:text="${attendees.size()}"></span>
                    </h3>

                    <div style="margin-bottom: 1rem;">
                        <a th:href="@{/admin/meetings/export/{id}(id=${meeting.id})}" class="btn btn-success btn-full"
                          style="background-color: #107c41; color: white; display:flex; gap:0.5rem; justify-content:center; align-items:center;">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                            </svg>
                            Exportar Asistencias a Excel
                        </a>
                    </div>

                    <div th:if="${#lists.isEmpty(attendees)}" class="empty-state-small">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3z" />
                        </svg>
                        <span>Sin asistentes registrados</span>
                    </div>
                    <div class="attendee-list" style="gap: 1rem;">
                        <div th:each="rec : ${attendees}" class="attendee-item" style="flex-wrap: wrap;">
                            <div class="attendee-avatar" th:text="${#strings.substring(rec.displayName, 0, 1)}">A</div>
                            <div class="attendee-info" style="flex: 1;">
                                <span class="attendee-name" th:text="${rec.displayName}"></span>
                                <span class="attendee-time" style="display:block; margin-top:2px;" th:text="${rec.studentId} + ' — ' + ${rec.email} + ' — ' + ${rec.career}"></span>
                            </div>
                            <div class="attendee-meta" style="font-size: 0.75rem; color: #64748b; margin-left: auto;">
                                <span th:text="${#temporals.format(rec.registeredAt, 'dd/MM/yyyy')}"></span><br>
                                <span th:text="${#temporals.format(rec.registeredAt, 'HH:mm')}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
