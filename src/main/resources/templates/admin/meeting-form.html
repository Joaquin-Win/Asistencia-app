<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>Encuentro</title>
</head>

<body>

    <div layout:fragment="page-title" th:text="${formTitle}">Encuentro</div>

    <main layout:fragment="content">
        <div class="page-nav">
            <a th:href="@{/admin/dashboard}" class="back-link">
                <svg viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                        clip-rule="evenodd" />
                </svg>
                Volver al Dashboard
            </a>
        </div>

        <div class="form-page-layout">
            <div class="card form-card">
                <h2 class="section-title" th:text="${formTitle}">Encuentro</h2>

                <form th:action="${formAction}" method="post" class="meeting-form">
                    <input type="hidden" name="id" th:value="${meeting.id}" />

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Título del Encuentro *</label>
                            <input type="text" name="title" class="form-control" th:value="${meeting.title}" required
                                placeholder="Ej: Encuentro 1 — Introducción" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Descripción *</label>
                            <textarea name="description" class="form-control form-textarea" required
                                placeholder="Descripción del encuentro..." th:text="${meeting.description}"></textarea>
                        </div>
                    </div>
                    <div class="form-row form-row-3">
                        <div class="form-group">
                            <label class="form-label">Fecha *</label>
                            <input type="date" name="date" class="form-control" th:value="${meeting.date}" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label">Hora de Inicio *</label>
                            <input type="time" name="startTime" class="form-control" th:value="${meeting.startTime}"
                                required />
                        </div>
                        <div class="form-group">
                            <label class="form-label">Hora de Fin *</label>
                            <input type="time" name="endTime" class="form-control" th:value="${meeting.endTime}"
                                required />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Ubicación *</label>
                            <input type="text" name="location" class="form-control" th:value="${meeting.location}"
                                required placeholder="Ej: Aula 305, Facultad..." />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Materiales</label>
                            <div class="materials-input-list" id="materialsList">
                                <div th:each="mat : ${meeting.materials}" class="material-input-row">
                                    <input type="text" name="materials" class="form-control" th:value="${mat}"
                                        placeholder="Nombre del material" />
                                    <button type="button" class="btn-icon btn-danger" onclick="removeMaterial(this)">
                                        <svg viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd"
                                                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                                clip-rule="evenodd" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <button type="button" class="btn btn-outline btn-sm" onclick="addMaterial()">+ Agregar
                                Material</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group form-group-inline">
                            <label class="toggle-label">
                                <input type="checkbox" name="locked" th:checked="${meeting.locked}"
                                    class="toggle-input" />
                                <span class="toggle-switch"></span>
                                <span class="toggle-text">Bloquear asistencia</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a th:href="@{/admin/dashboard}" class="btn btn-outline">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                    clip-rule="evenodd" />
                            </svg>
                            Guardar Encuentro
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <th:block layout:fragment="scripts">
        <script>
            function addMaterial() {
                const list = document.getElementById('materialsList');
                const row = document.createElement('div');
                row.className = 'material-input-row';
                row.innerHTML = `<input type="text" name="materials" class="form-control" placeholder="Nombre del material"/>
            <button type="button" class="btn-icon btn-danger" onclick="removeMaterial(this)">
                <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            </button>`;
                list.appendChild(row);
            }
            function removeMaterial(btn) { btn.closest('.material-input-row').remove(); }
        </script>
    </th:block>
</body>

</html>
